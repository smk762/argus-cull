name: Release

# On a v* tag: check the tag matches web/package.json, run the CI checks,
# push the web image to ghcr.io/<owner>/argus-cull, then create a GitHub Release
# from the tag's CHANGELOG.md section. Nothing goes to PyPI: this repo has no
# Python package. The sidecars (nudenet, erax, watermark, singguard) stay local
# compose builds.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches web/package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match web/package.json version $version."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: CHANGELOG has a section for this version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          grep -q "^## \[${TAG#v}\]" ../CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no [${TAG#v}] section."
            exit 1
          }

  publish-image:
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/argus-cull
          # A pre-release tag (v1.2.0-rc.1) gets its own tag but does not move
          # latest or the major.minor tag.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      # The web image is built with the default NEXT_PUBLIC_CURATOR_URL. With
      # that default the page calls the curator on its own host, port 8101. A
      # deployment that needs another curator URL builds its own image.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    runs-on: ubuntu-latest
    # After the image is pushed, so a Release never names an image that does not exist.
    needs: publish-image
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the release from the tag's CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Re-running the workflow must not fail on, or overwrite, a Release
          # that already exists or was edited by hand.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it as is."
            exit 0
          fi
          version="${TAG#v}"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {on=1; next} on && /^## / {exit} on' CHANGELOG.md \
            | sed '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no [$version] section; add one and re-run this job."
            exit 1
          fi
          printf '\n**Image:** `ghcr.io/%s/argus-cull:%s`\n' "$GITHUB_REPOSITORY_OWNER" "$version" >> notes.md
          printf '\n**Full changelog:** %s/%s/blob/%s/CHANGELOG.md\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$TAG" >> notes.md
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md $prerelease
