name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # The imported curator docs: every file recorded in sync/argus-curator.json, the pin at its commit,
      # and the opsec gate (private IPs, home paths, emails, the private denylist). Hashes: the fixture job.
      - run: npm run docs:check
        env:
          OPSEC_DENYLIST: ${{ secrets.OPSEC_DENYLIST }}
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The static demo (make pages): a pure static export of the committed tape, CSP on every page.
      - run: npm run build:pages
      - run: python3 -m py_compile ../scripts/record_tape.py ../scripts/make_sample_scan.py

  # The Dragonhound shared design layer (web/vendor/dh) is vendored from
  # dragonhound-site/shared and must not be edited here. Fails if a vendored file
  # changed locally or no longer matches the published v1 manifest; a newer
  # upstream version is only a warning (re-sync in its own PR).
  dh-shared:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node web/vendor/dh/sync-shared.mjs --check . --against https://dragonhound.dev/brand/v1/manifest.json --allow-outdated

  # Cull follows curator's dev branch, not a release: install the commit
  # sync/argus-curator.json records, then check the fixture and its record.
  fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline sync check
        run: python scripts/sync_check.py
      - name: Install curator at the recorded dev commit
        run: |
          commit=$(python -c "import json; print(json.load(open('sync/argus-curator.json'))['commit'])")
          pip install "argus-curator @ git+https://github.com/smk762/argus-curator@${commit}"
      - run: python scripts/check_fixture.py
      - run: python scripts/record_fixture.py --check
