name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Cull follows curator's dev branch, not a release: install the commit
  # sync/argus-curator.json records, then check the fixture and its record.
  fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline sync check
        run: python scripts/sync_check.py
      - name: Install curator at the recorded dev commit
        run: |
          commit=$(python -c "import json; print(json.load(open('sync/argus-curator.json'))['commit'])")
          pip install "argus-curator @ git+https://github.com/smk762/argus-curator@${commit}"
      - run: python scripts/check_fixture.py
      - run: python scripts/record_fixture.py --check
