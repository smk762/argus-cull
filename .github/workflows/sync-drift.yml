name: Curator drift

# Daily: has argus-curator's dev branch moved past the commit cull records in
# sync/argus-curator.json? If so, install the new HEAD, check and re-record the
# fixture, and open a PR into dev with the new record. If the PR cannot be
# opened (or the fixture check fails), open an issue instead. Once curator's
# docs are imported (argus-curator#138), the same PR re-pulls them.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: curator-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - id: compare
        run: |
          recorded=$(jq -r .commit sync/argus-curator.json)
          head=$(gh api repos/smk762/argus-curator/commits/dev --jq .sha)
          echo "recorded=$recorded" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "branch=sync/curator-${head:0:9}" >> "$GITHUB_OUTPUT"
          if [ "$recorded" = "$head" ]; then
            echo "Curator dev is still at ${head:0:9}."
            echo "moved=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --heads origin "sync/curator-${head:0:9}" >/dev/null; then
            echo "A sync branch for ${head:0:9} already exists."
            echo "moved=false" >> "$GITHUB_OUTPUT"
          else
            echo "moved=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.compare.outputs.moved == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: record
        if: steps.compare.outputs.moved == 'true'
        continue-on-error: true
        env:
          HEAD_SHA: ${{ steps.compare.outputs.head }}
        run: |
          pip install "argus-curator @ git+https://github.com/smk762/argus-curator@${HEAD_SHA}"
          python scripts/check_fixture.py
          python scripts/record_fixture.py --commit "$HEAD_SHA"
          python scripts/sync_check.py
      - id: pr
        if: steps.compare.outputs.moved == 'true' && steps.record.outcome == 'success'
        continue-on-error: true
        env:
          BRANCH: ${{ steps.compare.outputs.branch }}
          RECORDED: ${{ steps.compare.outputs.recorded }}
          HEAD_SHA: ${{ steps.compare.outputs.head }}
        run: |
          version=$(jq -r .version sync/argus-curator.json)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add sync/
          git commit -m "sync: argus-curator dev ${HEAD_SHA:0:9} (${version})"
          git push origin "$BRANCH"
          gh pr create --base dev --head "$BRANCH" \
            --title "sync: argus-curator dev ${HEAD_SHA:0:9} (${version})" \
            --body "argus-curator's \`dev\` moved from ${RECORDED:0:9} to ${HEAD_SHA:0:9}: https://github.com/smk762/argus-curator/compare/${RECORDED}...${HEAD_SHA}

          The fixture passes \`scripts/check_fixture.py\` at the new commit and \`sync/fixture-scan.json\` is re-recorded. Check the compare for changes the page should pick up (new \`/health\` or \`/detectors\` flags, scan or export fields) before merging."
      - if: steps.compare.outputs.moved == 'true' && (steps.record.outcome != 'success' || steps.pr.outcome != 'success')
        env:
          RECORDED: ${{ steps.compare.outputs.recorded }}
          HEAD_SHA: ${{ steps.compare.outputs.head }}
          WHY: ${{ steps.record.outcome != 'success' && 'The fixture check or re-record failed at the new commit' || 'The sync PR could not be opened' }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Curator dev moved to ${HEAD_SHA:0:9}"
          if gh issue list --state open --search "\"$title\" in:title" --json number --jq 'length' | grep -qv '^0$'; then
            echo "An issue for ${HEAD_SHA:0:9} is already open."
            exit 0
          fi
          gh issue create --title "$title" --body "argus-curator's \`dev\` moved from ${RECORDED:0:9} to ${HEAD_SHA:0:9}: https://github.com/smk762/argus-curator/compare/${RECORDED}...${HEAD_SHA}

          ${WHY} (${RUN}). Run \`make sync-curator\` locally, fix what it reports, and open the PR by hand."
