# Build the sibling argus-curator checkout instead of the dev commit
# docker-compose.yaml pins. Use this while working on curator changes that are
# not on curator's dev yet.
services:
  argus-curator:
    image: argus-curator:local
    build:
      context: ${CURATOR_CONTEXT:-../argus-curator}
      dockerfile: Dockerfile
      args:
        # Not the pinned commit's version: say what /health reports for this build.
        VERSION: ${CURATOR_LOCAL_VERSION:-0.0.0+local}
        # The CUDA image, as the default; CURATOR_GPU=0 builds the CPU image.
        GPU: ${CURATOR_GPU:-1}
