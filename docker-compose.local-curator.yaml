# Build the sibling argus-curator checkout instead of the published image.
# Use this while working on curator changes that are not on GHCR yet.
services:
  argus-curator:
    image: argus-curator:local
    build:
      context: ../argus-curator
      dockerfile: Dockerfile
      args:
        # The CUDA image, as the published one; CURATOR_GPU=0 builds the CPU image.
        GPU: ${CURATOR_GPU:-1}
