services:
  argus-curator:
    # curator's dev branch at the commit sync/argus-curator.json records, not a
    # release: cull's docs, demo data and curator all sit at that one commit.
    # Built from GitHub, so no sibling checkout is needed. scripts/sync_check.py
    # (make check) fails when the context sha or VERSION here differs from the
    # record, and scripts/record_fixture.py moves them with it. VERSION is what
    # /health reports (the image has no git history to derive it from); the tag
    # names the commit, so a moved record builds a new image on `up`.
    # The CUDA build: face detection, MiVOLO, Places365 and Fashionpedia. The
    # host needs the NVIDIA container runtime and a driver for CUDA 13; on a host
    # without one, set CURATOR_GPU=0 in .env and drop `gpus` below.
    # docker-compose.local-curator.yaml builds a sibling checkout instead.
    image: argus-curator:dev-0141bf321
    build:
      context: https://github.com/smk762/argus-curator.git#0141bf3212dcec1acbd7652c251940853bd6006f
      args:
        VERSION: 0.21.1.dev51+g0141bf321
        GPU: ${CURATOR_GPU:-1}
    gpus: all
    ports:
      - "${CURATOR_PORT:-8101}:8101"
    # How the suite finds this service (argus-cortex's discovery labels): argus-iris's
    # node agents read them and list it in the suite directory as peer "curator". The
    # same names and ports as curator's and retina's own compose files; check_compose_labels
    # in scripts/sync_check.py holds every Argus service here to them.
    labels:
      argus.peer: curator
      argus.service: argus-curator
      argus.health: /health
      argus.port: "8101"
    environment:
      # The peer label above, reported back in GET /health by a curator that has
      # argus-cortex 0.16's health contract; an older one ignores it.
      - ARGUS_PEER=curator
      - CURATOR_SOURCE_PATH=/data/images
      - CURATOR_EXPORT_PATH=/data/out
      - CURATOR_CACHE_DIR=/root/.cache/argus_curator/scans
      - HF_HOME=/root/.cache/huggingface
      - ARGUS_CURATOR_MIVOLO_MODEL=/root/.cache/argus_curator/models/mivolo_v2_d1_384.onnx
      - ARGUS_CURATOR_PLACES365_MODEL=/root/.cache/argus_curator/models/places365_resnet18.onnx
      - ARGUS_CURATOR_GARMENTS_MODEL=/root/.cache/argus_curator/models/yolos_fashionpedia.onnx
      # Both checks are on unless .env sets the URL empty.
      - ARGUS_CURATOR_NUDENET_URL=${ARGUS_CURATOR_NUDENET_URL-http://nudenet:8080}
      # Optional second detector. Empty turns it off. When NudeNet returns
      # nothing useful, curator maps EraX hits onto the same exposed labels.
      - ARGUS_CURATOR_ERAX_URL=${ARGUS_CURATOR_ERAX_URL-http://erax:8080}
      # Watermark detector for a scan's crops.detect. It runs only when a scan
      # asks for it, so the URL being set costs nothing. Empty refuses detect.
      - ARGUS_CURATOR_WATERMARK_URL=${ARGUS_CURATOR_WATERMARK_URL-http://watermark:8080}
      # SingGuard: argus-retina's SingGuard server, or agent-composer's
      # /api/guard/check (a proxy to it, the guard darkroom uses). Off (empty)
      # until .env sets it, e.g. http://composer.example:9150, or
      # http://singguard:8080 with the local-singguard profile.
      - ARGUS_CURATOR_SINGGUARD_URL=${ARGUS_CURATOR_SINGGUARD_URL-}
      # cascade: fast on every frame (about a second), slow on the frames
      # fast flags and on a MiVOLO age under 18 with an exposed score of at
      # least 0.2; slow's verdict stands. fast is a verdict and rule only;
      # fast-slow and slow also write why.
      - ARGUS_CURATOR_SINGGUARD_THINKING=${ARGUS_CURATOR_SINGGUARD_THINKING-cascade}
      # What the scan already knows, sent to SingGuard as recorded context:
      # age (MiVOLO estimate per face), folder, caption (a lens sidecar).
      # Empty sends the image alone.
      - ARGUS_CURATOR_SINGGUARD_CONTEXT=${ARGUS_CURATOR_SINGGUARD_CONTEXT-age,folder,caption}
      # Empty keeps the curator's localhost:3000 allow-list. A set value replaces
      # that list, so name every origin the page is opened as.
      - CURATOR_CORS_ORIGINS=${CURATOR_CORS_ORIGINS-}
      # Host names (no port) the curator is reached by, when a page served from
      # the curator's own host:port writes to it (argus-cortex 0.6 refuses a
      # same-host write by DNS name otherwise). Cull's page is another origin,
      # so CURATOR_CORS_ORIGINS covers it; this is rarely needed.
      - CURATOR_TRUSTED_HOSTS=${CURATOR_TRUSTED_HOSTS-}
      # Export's Move: each kept file (and its .txt / .xmp / .json sidecars)
      # leaves the source folder for the curated output root. ALLOW_MOVE=1 in
      # .env turns it on; off, the export dialog offers Copy and Symlink only.
      - CURATOR_ALLOW_MOVE=${ALLOW_MOVE:-${CURATOR_ALLOW_MOVE:-0}}
      # Curator 0.12: Delete in the grid may remove any scanned image from the
      # source folder. 0 in .env limits it to under-18 frames with an exposed
      # reading, the rule before 0.12.
      - CURATOR_ALLOW_DELETE=${CURATOR_ALLOW_DELETE-1}
      # Take turns on the GPU with argus-lens: one argus job at a time, each
      # waiting for free VRAM (argus_cortex.gpu). lens must mount the same host
      # directory (ARGUS_GPU_LOCK_DIR) and use the same lock file in it.
      # ARGUS_GPU_COORDINATOR=none in .env turns it off.
      - ARGUS_GPU_COORDINATOR=${ARGUS_GPU_COORDINATOR:-lease}
      - ARGUS_GPU_LEASE_PATH=/run/argus-gpu/argus-gpu.lock
      - ARGUS_GPU_LEASE_TIMEOUT_S=${ARGUS_GPU_LEASE_TIMEOUT_S:-300}
      # ARGUS_GPU_COORDINATOR=broker asks argus-iris, the suite's GPU broker,
      # instead; the lease above is its fallback while iris is down. Give the
      # broker URL as an IP: the container does not resolve LAN host names.
      # The token is the suite's caller token, from the host's .env only.
      - ARGUS_GPU_BROKER_URL=${ARGUS_GPU_BROKER_URL-}
      - ARGUS_GPU_BROKER_TOKEN=${ARGUS_GPU_BROKER_TOKEN-}
      - ARGUS_GPU_TENANT_MANIFEST=${ARGUS_GPU_TENANT_MANIFEST:-/app/gpu-tenant.yaml}
      - ARGUS_GPU_BROKER_FALLBACK=${ARGUS_GPU_BROKER_FALLBACK:-lease}
    volumes:
      - ${CURATOR_SOURCE_PATH:-./fixture}:/data/images
      # The curated output root (CURATED_OUTPUT_ROOT_PATH in .env).
      - ${CURATED_OUTPUT_ROOT_PATH:-./out}:/data/out
      - ~/.cache/argus_curator:/root/.cache/argus_curator
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ~/.insightface:/root/.insightface
      # The host-wide GPU lease's lock directory, shared with argus-lens.
      - ${ARGUS_GPU_LOCK_DIR:-/tmp/argus-gpu}:/run/argus-gpu
    restart: unless-stopped
    # Wait until NudeNet or EraX has its model loaded, so the first scan does not record
    # failed checks while the detectors load. One is enough: curator fills
    # from EraX when NudeNet fails. Neither up within the gate's retries only
    # warns, and curator starts anyway (its NSFW checks then fail).
    depends_on:
      nsfw-ready:
        condition: service_healthy
        required: false

  # The detectors are argus-retina's published images (AGPL-3.0), reached only
  # over HTTP: NudeNet 640m, EraX-NSFW and the watermark detector. Each runs on
  # the CPU, has its own HEALTHCHECK (healthy once its model has loaded) and
  # publishes no host port. RETINA_TAG in .env picks another release.
  # Each carries retina's discovery labels (argus.peer and the rest). The suite
  # directory builds a URL from a published port, and these publish none.
  nudenet:
    image: ghcr.io/smk762/argus-retina-nudenet:${RETINA_TAG:-0.2.0}
    labels:
      argus.peer: nudenet
      argus.service: argus-retina
      argus.health: /health
      argus.port: "8080"
    environment:
      - ARGUS_PEER=nudenet
    restart: unless-stopped

  # EraX-NSFW-V1.0 (YOLO11s). Optional: set ARGUS_CURATOR_ERAX_URL empty to
  # stop the curator calling it.
  erax:
    image: ghcr.io/smk762/argus-retina-erax:${RETINA_TAG:-0.2.0}
    labels:
      argus.peer: erax
      argus.service: argus-retina
      argus.health: /health
      argus.port: "8080"
    environment:
      - ARGUS_PEER=erax
    restart: unless-stopped

  # Watermark detector for curator's crops.detect: frames with a watermark at
  # the edge are cropped in memory before every check and exported cropped.
  # Curator does not wait on it; from 0.14.1 it refuses a scan that asks for
  # detection while this is down. The image ships no weights (fancyfeast's
  # YOLO11x states no licence), so watermark-weights fetches them first.
  watermark:
    image: ghcr.io/smk762/argus-retina-watermark:${RETINA_TAG:-0.2.0}
    labels:
      argus.peer: watermark
      argus.service: argus-retina
      argus.health: /health
      argus.port: "8080"
    environment:
      - ARGUS_PEER=watermark
    volumes:
      - watermark_weights:/models:ro
    restart: unless-stopped
    depends_on:
      watermark-weights:
        condition: service_completed_successfully
        required: false

  # One-shot: fetch the watermark weights into the watermark_weights volume,
  # pinned by Hub commit and sha256 (argus-retina's `make watermark-weights`),
  # so a re-upload or an error page fails here instead of changing the
  # detector. Skips the download when the file already matches. Offline, it
  # fails and the watermark detector reports `error` on /health. For mnemic's
  # CC-BY-4.0 YOLOv8s instead, set in .env:
  #   WATERMARK_WEIGHTS_URL=https://huggingface.co/mnemic/watermarks_yolov8/resolve/8e764d6b715afab10f27908f111a906486affafb/watermarks_s_yolov8_v1.pt
  #   WATERMARK_WEIGHTS_SHA256=234f6ab07701dcc45127758b2e111e6c288f2fdcf6c96438ec508297b4264a49
  # and WATERMARK_IMGSZ=640 under watermark's environment in compose.override.yaml.
  watermark-weights:  # nosemgrep: service-peer-label  one-shot: fetches the pinned watermark weights into a volume, then exits
    image: python:3.12-slim
    environment:
      - URL=${WATERMARK_WEIGHTS_URL:-https://huggingface.co/spaces/fancyfeast/joycaption-watermark-detection/resolve/9bb8f6a9054346e747adc7270b2cfa93849ae514/yolo11x-train28-best.pt}
      - SHA256=${WATERMARK_WEIGHTS_SHA256:-80b022e94239a65a3b50173096523f202ca39608b9063dd391d043323a51326e}
    volumes:
      - watermark_weights:/models
    restart: "no"
    command:
      - python
      - -c
      - |
        import hashlib, os, pathlib, sys, urllib.request
        path, want = pathlib.Path("/models/watermark.pt"), os.environ["SHA256"]
        digest = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
        if path.is_file() and digest(path) == want:
            sys.exit(0)
        tmp = path.with_suffix(".part")
        urllib.request.urlretrieve(os.environ["URL"], tmp)
        if digest(tmp) != want:
            tmp.unlink()
            sys.exit(f"watermark weights: sha256 mismatch for {os.environ['URL']}")
        tmp.chmod(0o644)
        tmp.replace(path)
        print("watermark weights fetched")

  # Healthy while either NSFW detector has its model loaded. Compose depends_on
  # cannot say "one of", so curator waits on this instead.
  nsfw-ready:  # nosemgrep: service-peer-label  readiness gate: sleeps, healthy once nudenet or erax has loaded; serves nothing
    image: python:3.12-slim
    command: ["sleep", "infinity"]
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import json, sys, urllib.request
          # Retina answers /health while its model loads; ready means loaded.
          def up(host):
              try:
                  with urllib.request.urlopen(f"http://{host}:8080/health", timeout=5) as resp:
                      return json.load(resp).get("model_state") in ("cpu", "gpu")
              except Exception:
                  return False
          sys.exit(0 if up("nudenet") or up("erax") else 1)
      interval: 5s
      timeout: 12s
      # About five minutes, long enough for either model to load.
      retries: 60

  # Optional local SingGuard-4b: argus-retina's published image, the same build
  # agent-composer's guard route and darkroom use. Off unless
  # `--profile local-singguard`; then set
  # ARGUS_CURATOR_SINGGUARD_URL=http://singguard:8080. It holds about 3.5 GB of
  # VRAM (4-bit), so do not run it beside another SingGuard on this GPU. No
  # weights in the image: the first start fetches 8.9 GB into the volume at a
  # pinned Hub commit and checks every file's sha256; later starts reuse it.
  singguard:
    profiles: ["local-singguard"]
    image: ghcr.io/smk762/argus-retina-singguard:${RETINA_TAG:-0.2.0}
    labels:
      argus.peer: singguard
      argus.service: argus-retina
      argus.health: /health
      argus.port: "8080"
    environment:
      - ARGUS_PEER=singguard
      # 4bit (about 3.5 GB of VRAM) or bf16 (about 9 GB).
      - SINGGUARD_QUANT=${SINGGUARD_QUANT:-4bit}
      # Generation budget for the reasoning modes (fast-slow, slow) and for
      # fast. A generation cut off before its <answer> tag is a failed check.
      - SINGGUARD_MAX_NEW_TOKENS=${SINGGUARD_MAX_NEW_TOKENS:-2048}
      - SINGGUARD_MAX_NEW_TOKENS_FAST=${SINGGUARD_MAX_NEW_TOKENS_FAST:-256}
      # fast, fast-slow, slow or cascade: judge every request in this mode
      # whatever the client asked for, for experiments. Empty honours the
      # request.
      - SINGGUARD_FORCE_THINKING=${SINGGUARD_FORCE_THINKING:-}
      # Guards /admin/unload and /admin/wake; set it so only argus-iris can
      # unload the model.
      - ARGUS_ADMIN_TOKEN=${ARGUS_ADMIN_TOKEN:-}
      # GPU leases are off here by default: the curator takes the host lease
      # for its own models during a scan and calls SingGuard inside it, so a
      # SingGuard lease on the same lock would wait on the scan. Set
      # SINGGUARD_GPU_COORDINATOR=broker to have argus-iris place it.
      - ARGUS_GPU_COORDINATOR=${SINGGUARD_GPU_COORDINATOR:-none}
      - ARGUS_GPU_BROKER_URL=${ARGUS_GPU_BROKER_URL-}
      - ARGUS_GPU_BROKER_TOKEN=${ARGUS_GPU_BROKER_TOKEN-}
    volumes:
      - singguard_weights:/models/singguard
    ports:
      - "127.0.0.1:${SINGGUARD_PORT:-8134}:8080"
    gpus: all
    restart: unless-stopped
    # The image's HEALTHCHECK reports healthy once the model is loaded (or
    # unloaded by argus-iris, since the next check loads it again).

  web:  # nosemgrep: service-peer-label  UI only: the Next.js cull app, no ServiceHealth /health for the directory to list
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CURATOR_URL: ${NEXT_PUBLIC_CURATOR_URL:-http://localhost:8101}
    ports:
      - "3000:3000"
    environment:
      # Read at request time. A change needs the web container recreated, not a rebuild.
      - ARGUS_CULL_BLUR_EXPOSED_SCORE=${ARGUS_CULL_BLUR_EXPOSED_SCORE-0.25}
      - ARGUS_CULL_POLICY_BLUR=${ARGUS_CULL_POLICY_BLUR-1}
      - CULL_LABELS_DIR=/labels
      - CULL_COHORTS_FILE=/config/cohorts.json
      - CULL_SOURCE_DIR=/data/images
    volumes:
      # Verdict labels (hard, ambiguous, adult, other, safe) by folder and path.
      # They are an evaluation record, not scan state, so they live here and
      # outlive the browser and the scan cache.
      - ${CULL_LABELS_PATH:-./labels}:/labels
      # Setting and wardrobe cohort rules. Edit the file and reload the page.
      - ${CULL_COHORTS_PATH:-./cohorts.json}:/config/cohorts.json:ro
      # The curator's source folder, read-only and at the same path, so the
      # page can read argus-lens caption sidecars (<image>.txt, <image>.xmp).
      - ${CURATOR_SOURCE_PATH:-./fixture}:/data/images:ro
    depends_on:
      - argus-curator
    restart: unless-stopped

volumes:
  singguard_weights:
  watermark_weights:
