# /health probe shared by the nudenet, erax and watermark sidecars.
x-sidecar-health: &sidecar-health
  test:
    [
      "CMD",
      "python",
      "-c",
      "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).read()",
    ]
  interval: 30s
  timeout: 10s
  retries: 10

services:
  argus-curator:
    # curator's dev branch at the commit sync/argus-curator.json records, not a
    # release: cull's docs, demo data and curator all sit at that one commit.
    # Built from GitHub, so no sibling checkout is needed. scripts/sync_check.py
    # (make check) fails when the context sha or VERSION here differs from the
    # record, and scripts/record_fixture.py moves them with it. VERSION is what
    # /health reports (the image has no git history to derive it from); the tag
    # names the commit, so a moved record builds a new image on `up`.
    # The CUDA build: face detection, MiVOLO, Places365 and Fashionpedia. The
    # host needs the NVIDIA container runtime and a driver for CUDA 13; on a host
    # without one, set CURATOR_GPU=0 in .env and drop `gpus` below.
    # docker-compose.local-curator.yaml builds a sibling checkout instead.
    image: argus-curator:dev-f9aae0bbf
    build:
      context: https://github.com/smk762/argus-curator.git#f9aae0bbfe20f9a25cc57dd608643dc168828b1b
      args:
        VERSION: 0.15.1.dev9+gf9aae0bbf
        GPU: ${CURATOR_GPU:-1}
    gpus: all
    ports:
      - "${CURATOR_PORT:-8101}:8101"
    environment:
      - CURATOR_SOURCE_PATH=/data/images
      - CURATOR_EXPORT_PATH=/data/out
      - CURATOR_CACHE_DIR=/root/.cache/argus_curator/scans
      - HF_HOME=/root/.cache/huggingface
      - ARGUS_CURATOR_MIVOLO_MODEL=/root/.cache/argus_curator/models/mivolo_v2_d1_384.onnx
      - ARGUS_CURATOR_PLACES365_MODEL=/root/.cache/argus_curator/models/places365_resnet18.onnx
      - ARGUS_CURATOR_GARMENTS_MODEL=/root/.cache/argus_curator/models/yolos_fashionpedia.onnx
      # Both checks are on unless .env sets the URL empty.
      - ARGUS_CURATOR_NUDENET_URL=${ARGUS_CURATOR_NUDENET_URL-http://nudenet:8080}
      # Optional second detector. Empty turns it off. When NudeNet returns
      # nothing useful, curator maps EraX hits onto the same exposed labels.
      - ARGUS_CURATOR_ERAX_URL=${ARGUS_CURATOR_ERAX_URL-http://erax:8080}
      # Watermark detector for a scan's crops.detect. It runs only when a scan
      # asks for it, so the URL being set costs nothing. Empty refuses detect.
      - ARGUS_CURATOR_WATERMARK_URL=${ARGUS_CURATOR_WATERMARK_URL-http://watermark:8080}
      # Darkroom's guard: agent-composer's /api/guard/check. Off (empty) until
      # .env sets it to your composer host, e.g. http://composer.example:9150,
      # or http://singguard:9150 with the local-singguard profile.
      - ARGUS_CURATOR_SINGGUARD_URL=${ARGUS_CURATOR_SINGGUARD_URL-}
      # cascade: fast on every frame (about a second), slow on the frames
      # fast flags and on a MiVOLO age under 18 with an exposed score of at
      # least 0.2; slow's verdict stands. fast is a verdict and rule only;
      # fast-slow and slow also write why.
      - ARGUS_CURATOR_SINGGUARD_THINKING=${ARGUS_CURATOR_SINGGUARD_THINKING-cascade}
      # What the scan already knows, sent to SingGuard as recorded context:
      # age (MiVOLO estimate per face), folder, caption (a lens sidecar).
      # Empty sends the image alone.
      - ARGUS_CURATOR_SINGGUARD_CONTEXT=${ARGUS_CURATOR_SINGGUARD_CONTEXT-age,folder,caption}
      # Empty keeps the curator's localhost:3000 allow-list. A set value replaces
      # that list, so name every origin the page is opened as.
      - CURATOR_CORS_ORIGINS=${CURATOR_CORS_ORIGINS-}
      # Export's Move: each kept file (and its .txt / .xmp / .json sidecars)
      # leaves the source folder for the curated output root. ALLOW_MOVE=1 in
      # .env turns it on; off, the export dialog offers Copy and Symlink only.
      - CURATOR_ALLOW_MOVE=${ALLOW_MOVE:-${CURATOR_ALLOW_MOVE:-0}}
      # Curator 0.12: Delete in the grid may remove any scanned image from the
      # source folder. 0 in .env limits it to under-18 frames with an exposed
      # reading, the rule before 0.12.
      - CURATOR_ALLOW_DELETE=${CURATOR_ALLOW_DELETE-1}
      # Take turns on the GPU with argus-lens: one argus job at a time, each
      # waiting for free VRAM (argus_cortex.gpu). lens must mount the same host
      # directory (ARGUS_GPU_LOCK_DIR) and use the same lock file in it.
      # ARGUS_GPU_COORDINATOR=none in .env turns it off.
      - ARGUS_GPU_COORDINATOR=${ARGUS_GPU_COORDINATOR:-lease}
      - ARGUS_GPU_LEASE_PATH=/run/argus-gpu/argus-gpu.lock
      - ARGUS_GPU_LEASE_TIMEOUT_S=${ARGUS_GPU_LEASE_TIMEOUT_S:-300}
    volumes:
      - ${CURATOR_SOURCE_PATH:-./fixture}:/data/images
      # The curated output root (CURATED_OUTPUT_ROOT_PATH in .env).
      - ${CURATED_OUTPUT_ROOT_PATH:-./out}:/data/out
      - ~/.cache/argus_curator:/root/.cache/argus_curator
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ~/.insightface:/root/.insightface
      # The host-wide GPU lease's lock directory, shared with argus-lens.
      - ${ARGUS_GPU_LOCK_DIR:-/tmp/argus-gpu}:/run/argus-gpu
    restart: unless-stopped
    # Wait until NudeNet or EraX answers, so the first scan does not record
    # failed checks while the sidecars load. One is enough: curator fills
    # from EraX when NudeNet fails. Neither up within the gate's retries only
    # warns, and curator starts anyway (its NSFW checks then fail).
    depends_on:
      nsfw-ready:
        condition: service_healthy
        required: false

  # NudeNet 640m (AGPL-3.0). Same /infer API as the official 320n image;
  # curator only talks to it over HTTP. No host port.
  nudenet:
    build:
      context: ./nudenet
      additional_contexts:
        common: ./sidecar-common
    ulimits:
      nofile: 1000000
    restart: unless-stopped
    healthcheck:
      <<: *sidecar-health
      start_period: 60s

  # EraX-NSFW-V1.0 (Apache-2.0, YOLO11s on CPU). Optional: set
  # ARGUS_CURATOR_ERAX_URL empty to stop the curator calling it.
  erax:
    build:
      context: ./erax
      additional_contexts:
        common: ./sidecar-common
    restart: unless-stopped
    healthcheck:
      <<: *sidecar-health
      start_period: 180s

  # Watermark detector (YOLO11x on CPU) for curator's crops.detect: frames
  # with a watermark at the edge are cropped in memory before every check and
  # exported cropped. Curator does not wait on it; a scan asking for detection
  # while it is still loading records its frames as crop:unchecked.
  watermark:
    build:
      context: ./watermark
      additional_contexts:
        common: ./sidecar-common
    restart: unless-stopped
    healthcheck:
      <<: *sidecar-health
      start_period: 180s

  # Healthy while either NSFW sidecar answers /health. Compose depends_on
  # cannot say "one of", so curator waits on this instead.
  nsfw-ready:
    image: python:3.12-slim
    command: ["sleep", "infinity"]
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          def up(host):
              try:
                  urllib.request.urlopen(f"http://{host}:8080/health", timeout=5).read()
                  return True
              except Exception:
                  return False
          sys.exit(0 if up("nudenet") or up("erax") else 1)
      interval: 5s
      timeout: 12s
      # About five minutes: past both sidecars' start_period.
      retries: 60

  # Optional local Sing-Guard-4b. Off unless `--profile local-singguard`.
  # Prefer agent-composer (`ARGUS_CURATOR_SINGGUARD_URL`); this copy cannot
  # do text-only checks and holds a GPU darkroom wants for ComfyUI.
  singguard:
    profiles: ["local-singguard"]
    build:
      context: ./singguard
    environment:
      - HF_HOME=/data/hf
      - SINGGUARD_MODEL=${SINGGUARD_MODEL:-inclusionAI/Sing-Guard-4b}
      # Hub commit sha to pin. The model loads with trust_remote_code, so this
      # also pins the code that runs. Empty follows the branch head.
      - SINGGUARD_REVISION=${SINGGUARD_REVISION:-}
      - SINGGUARD_LOAD_IN_4BIT=${SINGGUARD_LOAD_IN_4BIT:-0}
      # Generation budget for the reasoning modes (fast-slow, slow) and for
      # fast. A generation cut off before its <answer> tag is a failed check.
      - SINGGUARD_MAX_NEW_TOKENS=${SINGGUARD_MAX_NEW_TOKENS:-2048}
      - SINGGUARD_MAX_NEW_TOKENS_FAST=${SINGGUARD_MAX_NEW_TOKENS_FAST:-256}
      # fast, fast-slow, slow or cascade: judge every request in this mode
      # whatever the client asked for. Curator 0.5 can only ask for fast or
      # fast-slow, so this is how it gets slow or cascade (fast for every
      # frame, slow for the ones fast flags). Empty honours the request.
      - SINGGUARD_FORCE_THINKING=${SINGGUARD_FORCE_THINKING:-}
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - singguard_hf:/data/hf
    ports:
      - "127.0.0.1:${SINGGUARD_PORT:-9150}:9150"
    gpus: all
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9150/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 1800s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CURATOR_URL: ${NEXT_PUBLIC_CURATOR_URL:-http://localhost:8101}
    ports:
      - "3000:3000"
    environment:
      # Read at request time. A change needs the web container recreated, not a rebuild.
      - ARGUS_CULL_BLUR_EXPOSED_SCORE=${ARGUS_CULL_BLUR_EXPOSED_SCORE-0.25}
      - ARGUS_CULL_POLICY_BLUR=${ARGUS_CULL_POLICY_BLUR-1}
      - CULL_LABELS_DIR=/labels
      - CULL_COHORTS_FILE=/config/cohorts.json
      - CULL_SOURCE_DIR=/data/images
    volumes:
      # Verdict labels (hard, ambiguous, adult, other, safe) by folder and path.
      # They are an evaluation record, not scan state, so they live here and
      # outlive the browser and the scan cache.
      - ${CULL_LABELS_PATH:-./labels}:/labels
      # Setting and wardrobe cohort rules. Edit the file and reload the page.
      - ${CULL_COHORTS_PATH:-./cohorts.json}:/config/cohorts.json:ro
      # The curator's source folder, read-only and at the same path, so the
      # page can read argus-lens caption sidecars (<image>.txt, <image>.xmp).
      - ${CURATOR_SOURCE_PATH:-./fixture}:/data/images:ro
    depends_on:
      - argus-curator
    restart: unless-stopped

volumes:
  singguard_hf:
